<style>
/* Layout: soft-grey canvas, white cards with large radii, black pills + one lime accent. Header = round back button + centred title. Bottom dock = black pill with a lime action, like a checkout bar. */
:root{
  --bg:#F1F2F4; --card:#FFFFFF; --tile:#F4F5F7; --ink:#111214; --muted:#8C9097; --line:#E8E9EC;
  --black:#111214; --on-black:#FFFFFF; --lime:#D7F75B; --on-lime:#111214; --mint:#DDF5EC; --mint-ink:#1E7A5A;
  --warn:#9A5B00; --warn-soft:#FFF3D9; --bad:#C2291A; --bad-soft:#FDE7E4;
  --font:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-xl:32px; --r-lg:24px; --r-md:18px; --r-sm:14px;
  --shadow:0 18px 40px -24px rgba(17,18,20,.18), 0 2px 6px -2px rgba(17,18,20,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html{--tg-bottom:0px;--sab:env(safe-area-inset-bottom,0px);--navx:0px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-os="android"][data-nav="buttons"]{--sab:max(env(safe-area-inset-bottom,0px),var(--tg-bottom));--navx:var(--tg-bottom)}
html,body{width:100%;max-width:100%;overscroll-behavior-x:none;overscroll-behavior-y:auto;   /* iOS rubber-band: the page stretches at the top/bottom and springs back; Telegram swipe-to-close is off (disableVerticalSwipes) */
-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{overflow-x:hidden}   /* on the root only: the page itself scrolls, so jumps to the top work */
body{min-height:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;padding:calc(12px + var(--tg-top, env(safe-area-inset-top,0px))) 16px 12px}
.top .title{text-align:center;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);flex:none}
.round svg{width:20px;height:20px}
.round.ghost{background:transparent;box-shadow:none}
.lang{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.lang button{border:0;background:none;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
/* dark theme (◐) */
html.mono{color-scheme:dark;--bg:#0D0E10;--card:#1A1B1F;--tile:#25272C;--ink:#F2F3F5;--muted:#9A9FA7;--line:#2E3036;--black:#2B2D33;--on-black:#FFFFFF;--mint:#16302A;--mint-ink:#7FE0B8;--warn:#F5C36B;--warn-soft:#3A2E14;--bad:#FF8A7A;--bad-soft:#3D1C18;--shadow:none}
html.mono .dock .pillbar{background:#000}
html.mono input,html.mono select,html.mono textarea{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--black);color:var(--on-black)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--black);color:var(--lime);display:inline-flex;align-items:center;justify-content:center;font-weight:800;border:0;cursor:pointer}

main{padding:4px 16px calc(128px + var(--navx));max-width:520px;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:22px;min-width:0}
main,.card,.rows,.lrow,.photo{max-width:100%}
img{max-width:100%;height:auto}
input[type=date]{display:block;min-width:0;-webkit-appearance:none}
.card{background:var(--card);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:var(--mint-ink);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;align-self:flex-start}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.grey{background:var(--tile);color:var(--muted)}

/* hero */
.hello{display:flex;flex-direction:column;gap:2px;padding:6px 4px 0}
button.hello{border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;align-self:flex-start;border-radius:16px}
.hello .pen{display:inline-flex;vertical-align:middle;margin-left:10px;width:30px;height:30px;border-radius:50%;background:var(--tile);align-items:center;justify-content:center;color:var(--muted)}
.hello .pen svg{width:15px;height:15px}
.hero{display:flex;flex-direction:column;gap:14px}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero .big small{font-size:22px;color:var(--muted);font-weight:700;letter-spacing:-.02em}
.pill{background:var(--tile);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{border:0;background:var(--card);border-radius:var(--r-lg);padding:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;font-weight:800}
.qbtn .ico{width:40px;height:40px;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.qbtn .ico svg{width:20px;height:20px}
.qbtn span.s{font-weight:600;font-size:12px;color:var(--muted)}

/* list rows (like Delivery / Payment rows) */
.rows{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-xl);padding:8px;box-shadow:var(--shadow)}
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:2px 14px;align-items:center;padding:10px;border:0;background:none;text-align:left;width:100%;border-radius:20px;cursor:pointer}
.lrow:hover{background:var(--tile)}
.lrow.n{grid-template-columns:22px 52px 1fr auto}
.lrow .no{grid-row:1/3;font-size:16px;font-weight:700;color:var(--muted);text-align:center}
.lrow .tile{grid-row:1/3;width:52px;height:52px;border-radius:16px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.lrow .tile svg{width:22px;height:22px}
.lrow .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lrow .a{font-weight:800;text-align:right;white-space:nowrap}
.lrow .u{font-size:12px;color:var(--muted);text-align:right;font-weight:700}
.empty{text-align:center;padding:36px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .tile{width:72px;height:72px;border-radius:24px;background:var(--tile);display:flex;align-items:center;justify-content:center}

/* dock: black pill at the bottom */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(14px + var(--sab));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .pillbar.solo{padding:8px}
.dock .pillbar.hasback{padding-left:8px}
.dock .pillbar.hasback .info{flex:1 1 auto;min-width:0;align-items:center;text-align:center}
.dock .pillbar.hasback .info .k{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .backbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;height:52px;padding:0 16px 0 12px;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.dock .pillbar{max-width:520px;margin:0 auto;background:var(--black);color:var(--on-black);border-radius:999px;padding:8px 8px 8px 22px;display:flex;align-items:center;gap:10px;min-height:68px}
.dock .info{display:flex;flex-direction:column;flex:0 0 auto}
.dock .info .k{font-size:11px;color:rgba(255,255,255,.55);font-weight:700}
.dock .info .v{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dock .info{min-width:0}
.dock .pillbar>*{position:relative}
@media (max-width:380px){.dock{padding-left:10px;padding-right:10px}.dock .pillbar{gap:6px;padding-left:16px}.dock .pillbar.hasback{padding-left:6px}.dock .backbtn{padding:0 12px}.dock .backbtn span{display:none}.cta{padding:0 16px}.dock .info .v{font-size:15px}.dock .chev{display:none}}
.chev{color:var(--lime);font-weight:800;letter-spacing:-2px;font-size:16px;opacity:.9;flex:1 1 0;min-width:0;overflow:hidden;text-align:center}
.cta{border:0;background:var(--lime);color:var(--on-lime);border-radius:999px;height:52px;padding:0 22px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden}
.cta svg{flex:none}
.cta svg{width:20px;height:20px}
.cta:disabled{opacity:.4;cursor:not-allowed}
.cta.full{flex:1;justify-content:center}
.dock .ghostbtn{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:999px;height:52px;padding:0 18px;font-weight:800;cursor:pointer}

/* buttons */
.btn{border:0;border-radius:999px;min-height:54px;padding:0 22px;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--black);color:var(--on-black)}
.btn.light{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.tilebtn{background:var(--tile);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.link{background:none;color:var(--ink);min-height:40px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}

/* steps pager like "‹ 3/5 ›" */
.pager{align-self:center;display:inline-flex;align-items:center;gap:16px;background:var(--card);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:800;color:var(--muted);box-shadow:var(--shadow)}
.pager .dots{display:flex;gap:6px}
.pager .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pager .dots i.on{background:var(--black);width:18px;border-radius:3px}
.pager .dots{align-items:center}
.pager .dot{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:22px;height:30px;margin:-12px -8px}
.pager .dot i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.bigq{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;text-align:center}

/* capture */
.photo{background:var(--card);border-radius:var(--r-xl);min-height:300px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:var(--shadow);padding:18px}
.photo img{max-height:360px;max-width:100%;border-radius:18px;object-fit:contain}
.photo .ph{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted);text-align:center}
.photo .ph .tile{width:84px;height:84px;border-radius:28px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.scan{position:absolute;left:18px;right:18px;height:4px;border-radius:2px;background:var(--lime);box-shadow:0 0 22px var(--lime);top:18px;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 22px)}}
.reading{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;border-radius:999px;padding:10px 16px;font-weight:800;font-size:13px;display:flex;gap:10px;align-items:center;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.scan{animation:none;top:50%}}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;gap:8px;padding:0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px;width:100%;border:2px solid transparent;background:var(--tile);border-radius:var(--r-md);padding:14px 16px;min-height:54px;font-weight:700;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
textarea{min-height:92px;resize:vertical}
.low input,.low select{border-color:#F2C46B;background:var(--warn-soft)}
.conf{font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.05em}
.conf.low{background:var(--warn-soft);color:var(--warn)}
.conf.high{background:var(--mint);color:var(--mint-ink)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.amount-in input{font-size:22px;font-weight:800;letter-spacing:-.02em}

/* chips */
.q{display:flex;flex-direction:column;gap:12px}
/* smooth screen changes + smooth programmatic scrolling */

/* iOS-like motion: push/pop between screens, springy press, translucent header */
#main.first .screen>*{animation:rise .7s cubic-bezier(.32,.72,0,1) both}
#main.first .screen>*:nth-child(2){animation-delay:.05s}#main.first .screen>*:nth-child(3){animation-delay:.1s}#main.first .screen>*:nth-child(4){animation-delay:.15s}#main.first .screen>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}
main.ghost{position:fixed;margin:0;box-sizing:border-box;pointer-events:none;background:var(--bg);will-change:transform}
#main.moving{position:relative;background:var(--bg);min-height:100vh;will-change:transform}
.pend{animation:rise .45s cubic-bezier(.32,.72,0,1) both}
button:not(.dot),.lrow,.check{transition:transform .45s cubic-bezier(.32,.72,0,1),background-color .2s,opacity .2s}
button:not(.dot):not(:disabled):active,.lrow:active,.check:active{transform:scale(.965);transition-duration:.12s}
.lang button:active,.dock .cta:active,.dock .backbtn:active{transform:scale(.92)}
.top{transition:background-color .25s,box-shadow .25s}
.top.scrolled{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
.dock .pillbar{transition:background .3s ease}
@media (prefers-reduced-motion:reduce){#main.first .screen>*,.pend{animation:none}button:not(.dot):active,.lrow:active,.check:active{transform:none}}
.sentov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .25s}
.sentov.in{opacity:1}
.sentbox{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.sentbox h2{margin:8px 0 0;font-size:28px;letter-spacing:-.02em}
.sentbox p{margin:0;font-weight:600}
.sentmark{width:132px;height:132px;display:flex;align-items:center;justify-content:center}
.spin.big{width:56px;height:56px;border-width:5px}
.sentmark svg{width:132px;height:132px}
.sentmark .c{fill:var(--lime);stroke:var(--black);stroke-width:6;transform-origin:60px 60px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.sentmark .k{fill:none;stroke:var(--black);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .4s .25s ease-out forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.sentsum{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:var(--r-lg);padding:14px 22px;box-shadow:var(--shadow);margin:6px 0 4px}
.sentsum b{font-size:28px;font-weight:800}
.sentsum span{font-size:13px;font-weight:700;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sentmark .c,.sentmark .k{animation:none;stroke-dashoffset:0}}
.pagerrow{display:flex;align-items:center;justify-content:center;gap:8px}
.shotwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
button.card.addshot{border:2px dashed var(--line);box-shadow:none;display:flex;align-items:center;gap:14px;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.addshot .tile{width:48px;height:48px;border-radius:14px;background:var(--lime);display:flex;align-items:center;justify-content:center;flex:none}
.addshot .tile svg{width:22px;height:22px}
button.card.shot{position:relative;border:0;padding:8px;cursor:zoom-in;display:flex;justify-content:center;align-items:center;min-height:120px;width:100%;font:inherit;color:inherit}
.shot img{max-width:100%;max-height:240px;border-radius:16px;display:block;object-fit:contain}
.shot .zoomtag{position:absolute;right:16px;bottom:16px;background:var(--black);color:#fff;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px}
.sheetv{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
.sheetv .sbar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--tg-top,env(safe-area-inset-top,0px))) 12px 10px}
.sheetv .sbar .ttl{flex:1;min-width:0}
.sheetv .sbar .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetv .sbar .ttl span{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.sheetv .grid{flex:1;overflow:auto;background:var(--card);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.sheetv table{border-collapse:separate;border-spacing:0;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:100%}
.sheetv td,.sheetv th{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 8px;white-space:nowrap;height:26px;color:var(--ink);background:var(--card);text-align:left}
.sheetv th{position:sticky;top:0;z-index:2;background:var(--tile);color:var(--muted);font-weight:800;text-align:center;font-size:11px}
.sheetv td.rn{position:sticky;left:0;z-index:1;background:var(--tile);color:var(--muted);text-align:center;font-weight:800;font-size:11px;min-width:34px}
.sheetv th.corner{left:0;z-index:3}
.sheetv td.h{font-weight:800;background:var(--tile)}
.sheetv td.lbl{color:var(--muted);font-weight:700}
.sheetv td.num{text-align:right}
.sheetv td.ttl1{font-size:15px;font-weight:800}
.sheetv td.tot{font-weight:800;border-top:2px solid var(--ink)}
.sheetv td.wrap{white-space:normal;min-width:220px;max-width:320px}
.sheetv .tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px calc(10px + var(--sab));border-top:1px solid var(--line);background:var(--bg)}
.sheetv .tabs button{border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:12px;font-weight:800;background:var(--tile);color:var(--muted);white-space:nowrap;cursor:pointer}
.sheetv .tabs button[aria-pressed="true"]{background:var(--black);color:var(--on-black)}
.sheetv .xbtn{border:0;background:var(--lime);color:var(--on-lime);border-radius:999px;height:40px;padding:0 14px;font:inherit;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.sheetv .xbtn svg{width:16px;height:16px}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(17,18,20,.94)}
.viewer .vbox{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:calc(56px + var(--tg-top,0px)) 12px 24px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.viewer.zoom .vbox{display:block}
.viewer.zoom img{max-width:none;max-height:none;width:250%;cursor:zoom-out}
.viewer .vclose{display:flex;align-items:center;justify-content:center;position:absolute;top:calc(12px + var(--tg-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#111214;font-size:18px;font-weight:800}
.q.miss{background:var(--bad-soft);border-radius:var(--r-lg);padding:12px;margin:0 -12px;box-shadow:inset 0 0 0 2px var(--bad)}
.q.miss>h3{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--card);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;min-height:44px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.chip .c{font-size:11px;color:var(--muted);font-weight:800}
.chip[aria-pressed="true"]{background:var(--black);color:var(--on-black)}
.chip[aria-pressed="true"] .c{color:var(--lime)}
.chip.tpl{background:var(--mint);color:var(--mint-ink);box-shadow:none}

/* purpose (GL) cards */
.gls{display:flex;flex-direction:column;gap:8px}
.gl{border:0;background:var(--card);border-radius:var(--r-lg);padding:12px;cursor:pointer;display:grid;grid-template-columns:48px 1fr auto;gap:2px 14px;align-items:center;text-align:left;box-shadow:var(--shadow)}
.gl .tile{grid-row:1/3;width:48px;height:48px;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.gl .t{font-weight:800}
.gl .d{font-size:12px;color:var(--muted);font-weight:600}
.gl .code{grid-row:1/3;font-size:12px;font-weight:800;color:var(--muted)}
/* iOS Safari centres grid items inside <button>: pin every column and align left explicitly */
.gl,.lrow,.chopt,.qbtn,.formpick{justify-items:start;text-align:left}
.gl .tile{grid-column:1;justify-self:start}
.gl .t{grid-column:2;grid-row:1;justify-self:stretch;width:100%;text-align:left}
.gl .d{grid-column:2;grid-row:2;justify-self:stretch;width:100%;text-align:left}
.gl .code{grid-column:3;justify-self:end}
.lrow .t,.lrow .m{justify-self:stretch;width:100%;text-align:left;min-width:0}
.lrow .a,.lrow .u{justify-self:end;text-align:right}
.lrow .no,.lrow .tile{justify-self:center}
.chopt .grow,.formpick .grow{text-align:left;min-width:0}
.gl[aria-pressed="true"]{background:var(--black);color:var(--on-black)}
.gl[aria-pressed="true"] .tile{background:var(--lime);color:var(--on-lime)}
.gl[aria-pressed="true"] .d,.gl[aria-pressed="true"] .code{color:rgba(255,255,255,.6)}
.more{border:0;background:none;font-weight:800;color:var(--ink);cursor:pointer;padding:6px 4px;align-self:flex-start;text-decoration:underline;text-underline-offset:3px}

/* rate: big number + black price pill */
.rate-hero{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 20px}
.rate-hero .amt{font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1}
.rate-hero .amt small{font-size:22px;color:var(--muted);letter-spacing:-.02em}
.blackpill{background:var(--black);color:#fff;border-radius:999px;padding:10px 20px;font-size:20px;font-weight:800}
.rate-hero .eq{font-weight:700;color:var(--muted);font-size:14px}

/* review: order-info style */
.info-rows{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.irow:last-child{border-bottom:0}
button.irow.tap{all:unset;display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline;cursor:pointer;width:100%}
button.irow.tap:last-child{border-bottom:0}
button.irow.tap:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:8px}

/* ===================== API ===================== */
async function api(action, data={}, timeoutMs) {
  if (DEMO) return DEMO_API[action](data);
  const ctl = timeoutMs && window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(()=>ctl.abort(), timeoutMs) : 0;
  let res;
  try{ res = await fetch(CONFIG.API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, signal: ctl ? ctl.signal : undefined,
    body: JSON.stringify(Object.assign({ action, initData: tg ? tg.initData : "", ek: S.ek || "" }, data)) }); }
  catch(e){ if(e && e.name==="AbortError"){ const x=new Error("SLOW"); x.slow=true; throw x; } throw e; }
  finally{ clearTimeout(tm); }
  const j = await res.json();
  if (!j.ok){ const er=new Error(j.error || "Server error");
    if(/^DUPLICATE:/.test(j.error||"")){ try{ er.dup=JSON.parse(j.error.slice(10)); }catch(x){} er.message=T().dupShort; }
    throw er; }
  return j;
}

/* shown once per person: remembered on the phone, in Telegram and on the server (whichever survives a restart) */
function markGuideSeen(){ store("guideDone",true); try{ tg && tg.CloudStorage && tg.CloudStorage.setItem("guideDone","1"); }catch(e){}
  if(S.user && !S.user.guide_seen){ S.user.guide_seen="1"; saveSnap(); api("updateProfile",{profile:{guide_seen:"1"}}).catch(()=>{}); } }
function guideSeenInCloud(cb){ let done=false; const fin=v=>{ if(!done){ done=true; cb(v); } };
  try{ if(!(tg && tg.CloudStorage)) return fin(false); tg.CloudStorage.getItem("guideDone",(err,v)=>fin(!err && v==="1")); setTimeout(()=>fin(false),2500); }catch(e){ fin(false); } }
function startGuide(manual){
  if($(".guide")) return;
  if(S.screen!=="home"){ go("home"); setTimeout(()=>startGuide(manual),560); return; }
  const t=T(), steps=t.guide; let i=0;
  const el=document.createElement("div"); el.className="guide";
  el.innerHTML=`<div class="g-hole"></div><div class="g-card" role="dialog" aria-modal="true"></div>`;
  document.body.appendChild(el);
  const hole=el.querySelector(".g-hole"), card=el.querySelector(".g-card");
  const finish=()=>{ store("guideDone",true); try{ tg && tg.CloudStorage && tg.CloudStorage.setItem("guideDone","1"); }catch(e){} el.classList.remove("in"); setTimeout(()=>el.remove(),300); window.scrollTo({top:0,behavior:"smooth"}); };
  const place=()=>{
    const st=steps[i], tg_=st.sel && document.querySelector(st.sel);
    const H=innerHeight, W=innerWidth;
    if(tg_){ const r=tg_.getBoundingClientRect(), pad=8, rad=parseFloat(getComputedStyle(tg_).borderTopLeftRadius)||18;
      Object.assign(hole.style,{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:(r.width+pad*2)+"px",height:(r.height+pad*2)+"px",borderRadius:(rad+pad)+"px",opacity:1});
      const below = r.top+r.height/2 < H*0.5;
      card.style.top = below ? Math.min(H-24-card.offsetHeight, r.bottom+pad+14)+"px" : "";
      card.style.bottom = below ? "" : Math.max(16, H-r.top+pad+14)+"px";
    } else {
      Object.assign(hole.style,{left:W/2+"px",top:H/2+"px",width:"0px",height:"0px",borderRadius:"50%",opacity:1});
      card.style.top = Math.max(24,(H-card.offsetHeight)/2)+"px"; card.style.bottom="";
    }
  };
  const show=()=>{
    const st=steps[i], last=i===steps.length-1;
    card.classList.remove("show");
    card.innerHTML=`<div class="g-top"><span class="g-n">${i+1} / ${steps.length}</span>${last?"":`<button type="button" class="g-skip">${t.gSkip}</button>`}</div>
      <h3>${st.h}</h3><p>${st.p}</p>
      <div class="g-dots">${steps.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <div class="g-btns">${i?`<button type="button" class="btn light g-back">${t.backBtn}</button>`:""}<button type="button" class="btn g-next">${last?t.gDone:t.gNext}</button></div>`;
    card.querySelector(".g-next").onclick=()=>{ haptic(); if(last) finish(); else { i++; show(); } };
    const b=card.querySelector(".g-back"); if(b) b.onclick=()=>{ haptic(); i--; show(); };
    const sk=card.querySelector(".g-skip"); if(sk) sk.onclick=finish;
    const target=st.sel && document.querySelector(st.sel);
    const fixed = target && getComputedStyle(target.closest(".dock")||target).position==="fixed";
    if(target && !fixed) target.scrollIntoView({block:"center",behavior:REDUCED()?"auto":"smooth"});
    setTimeout(()=>{ place(); card.classList.add("show"); }, target&&!fixed?380:40);
  };
  requestAnimationFrame(()=>el.classList.add("in"));
  addEventListener("resize",()=>{ if(el.isConnected) place(); });
  show();
}

/* Reads one photo into a draft-like object d (used for single receipts and for batches) */
async function readInto(d, file){
  d._qr=null; d._src={}; d._aiErr=""; d._err=""; d._mm=null; d._dup=null; d.photo_hash=""; d._dateFixed="";
  if(!isPdf(file)) try{ d._img = d._img || URL.createObjectURL(file); }catch(e){}
  const {b64,mime,url,qr} = await compress(file);
  if(!d._img || isPdf(file)) d._img=url;
  d._b64=b64; d._mime=mime; d._fname=file.name||"";
  if(qr){ d._qr=parseQr(qr); if(d._qr && d._qr.kind) applyTrustedQr(d); }   // only official fiscal QR is applied before the AI
  await aiInto(d);
}
/* Official fiscal QR (tax-office formats): exact amount, date, currency */
function applyTrustedQr(d){
  const q=d._qr; d._src=d._src||{};
  if(q.total>0){ d.amount=q.total; d._src.total="qr"; }
  if(q.date){ d.payment_date=q.date; d._src.date="qr"; }
  if(q.currency && curByCode(q.currency)){ d.currency=curByCode(q.currency); d._src.currency="qr"; d.rate=""; progFromCurrency(d); }
}
/* AI reading + reconciliation with the QR. Untrusted QR values never override the photo silently. */
async function aiInto(d){
  d._aiErr=""; d._err=""; d._mm=null;
  const src=d._src||(d._src={}), q=d._qr;
  const ask=()=>api("parseReceipt",{image:d._b64,mime:d._mime,lang:S.lang,photo_id:d.photo_id||"",qr:q?q.raw:"",fname:d._fname||""},40000);
  const netErr=e=>e instanceof TypeError || /Load failed|Failed to fetch|NetworkError|network/i.test(e&&e.message||"");
  let j;
  try{ j=await ask(); }
  catch(e){ if(e.slow){ d._aiErr="SLOW"; await keepPhoto(d); return; }   // the AI is too slow right now → hand the fields to the person, keep the photo
    if(!netErr(e)) throw e;                     // the connection dropped (slow AI or weak network) → one quiet retry
    await wait(1200);
    try{ j=await ask(); }catch(e2){ if(e2.slow||netErr(e2)){ d._aiErr="NET"; await keepPhoto(d); return; } throw e2; } }
  const x = j.result||{};
  if(x.photo_id) d.photo_id=x.photo_id;
  if(x.photo_mime) d.photo_mime=x.photo_mime;
  if(x.photo_hash) d.photo_hash=x.photo_hash;
  if(x.date_fixed_from) d._dateFixed=x.date_fixed_from;
  if(x.duplicate){ d._dup=x.duplicate; return; }   // this exact photo was already added
  if(x.ai_error){
    d._aiErr=x.ai_error;
    if(q && !q.kind){ if(q.total>0){ d.amount=q.total; src.total="qr?"; } if(q.date){ d.payment_date=q.date; src.date="qr?"; } }
    return;
  }
  if(d._manual){ d._ai=x; d._conf=Object.assign({},x.confidence||{});   // the person is already typing → fill only empty fields
    if(x.vendor && !String(d.vendor||"").trim()) d.vendor=x.vendor;
    if(x.items_summary && !d.note) d.note=x.items_summary;
    if(x.category && LISTS.expenseTypes.includes(x.category) && !d.expense_type) d.expense_type=x.category;
    if(!(+d.amount>0) && Number(x.total)>0) d.amount=Number(x.total);
    if(x.currency && !(+d.amount>0)) d.currency=curByCode(String(x.currency).toUpperCase())||d.currency;
    if(x.date && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && d.payment_date===today()) d.payment_date=x.date;
    progFromCurrency(d); return; }
  d._ai=x; d._conf=Object.assign({},x.confidence||{});
  if(x.vendor) d.vendor=x.vendor;
  if(x.items_summary) d.note=x.items_summary;
  if(x.category && LISTS.expenseTypes.includes(x.category)) d.expense_type=x.category;
  const aiT=Number(x.total)||0, same=(a,b)=>Math.abs(Number(a)-Number(b))<0.01;
  // amount
  if(src.total==="qr"){ if(aiT && !same(aiT,d.amount)) d._mm={qr:d.amount,ai:aiT,used:"qr"}; }
  else if(q && q.total>0 && !q.kind){
    if(aiT && same(aiT,q.total)){ d.amount=aiT; src.total="qr"; d._conf.total="high"; }
    else if(aiT){ d.amount=aiT; d._mm={qr:q.total,ai:aiT,used:"photo"}; d._conf.total="low"; }
    else { d.amount=q.total; src.total="qr?"; d._conf.total="low"; }
  } else if(aiT) d.amount=aiT;
  // date
  if(src.date!=="qr"){
    if(q && q.date && !q.kind && x.date && q.date===x.date){ d.payment_date=x.date; src.date="qr"; }
    else if(x.date) d.payment_date=x.date;
  }
  // currency
  if(x.currency && src.currency!=="qr") d.currency = curByCode(String(x.currency).toUpperCase()) || d.currency;
  progFromCurrency(d);
}
/* single-receipt wrappers */
async function readFile(file){
  const d=S.draft; render();
  try{ await readInto(d,file); haptic(d._aiErr?"error":"success"); }catch(e){ d._err=e.message; haptic("error"); keepPhoto(d); }
  const typing=d._manual && /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
  d._reading=false; if(S.screen==="wizard" && S.draft===d){ if(typing) toast(T().aiLate); else render(); }
}
async function runAi(){
  const d=S.draft; d._reading=true; if(S.screen==="wizard") render();
  try{ await aiInto(d); }catch(e){ d._err=e.message; }
  d._reading=false; if(S.screen==="wizard") render();
}
/* Does this amount need a human look? (AI unsure, QR and photo disagree, or a large amount) */
function amountDoubt(d){
  const usd = d.rate>0 ? d.amount/d.rate : 0;
  return !!(d._mm || (d._conf && d._conf.total && d._conf.total!=="high") || (d._src&&d._src.total==="qr?") || usd>1000);
}
const isPdf = f => f && (f.type==="application/pdf" || /\.pdf$/i.test(f.name||""));
/* PDF receipts (Bolt, Yandex, e-mail invoices): pages are drawn into one picture, then read like a photo — QR scan, preview and the AI all work the same */
let PDF_LIB=null;
function loadPdfLib(){ if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib); if(PDF_LIB) return PDF_LIB;
  PDF_LIB=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); }catch(e){ rej(e); } };
    sc.onerror=()=>{ PDF_LIB=null; rej(new Error("pdf.js")); }; document.head.appendChild(sc); });
  return PDF_LIB; }
async function pdfToJpegFile(file){
  const lib=await loadPdfLib(); const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const n=Math.min(doc.numPages,3), pages=[];
  for(let i=1;i<=n;i++){ const pg=await doc.getPage(i); const v0=pg.getViewport({scale:1}); const v=pg.getViewport({scale:Math.min(3,1400/v0.width)});
    const c=document.createElement("canvas"); c.width=Math.round(v.width); c.height=Math.round(v.height); const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:v}).promise; pages.push(c); }
  const W=Math.max(...pages.map(c=>c.width)), H=pages.reduce((a,c)=>a+c.height,0), out=document.createElement("canvas"); out.width=W; out.height=H;
  const o=out.getContext("2d"); o.fillStyle="#fff"; o.fillRect(0,0,W,H); let y=0; pages.forEach(c=>{ o.drawImage(c,0,y); y+=c.height; });
  const blob=await new Promise(r=>out.toBlob(r,"image/jpeg",0.9));
  return new File([blob],(file.name||"receipt").replace(/\.pdf$/i,"")+".jpg",{type:"image/jpeg"});
}
async function compress(file){
  if(isPdf(file)){
    try{ file=await pdfToJpegFile(file); }
    catch(e){ const b64=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result.split(",")[1]); fr.onerror=rej; fr.readAsDataURL(file); });
      return {b64,mime:"application/pdf",url:null,qr:null}; }   // no pdf.js → the AI reads the PDF itself
  }
  return compressImage(file);
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=async()=>{ try{ let qr=null; try{ await loadQrLib(); qr=scanQr(img); }catch(e){}
      const max=img.naturalHeight>img.naturalWidth*2.2?2200:1400; /* smaller upload, receipt text still sharp */ let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      const data=c.toDataURL("image/jpeg",0.82); resolve({b64:data.split(",")[1],mime:"image/jpeg",url:data,qr}); }catch(e){ reject(e); } };
    img.onerror=()=>reject(new Error("Cannot open image")); img.src=url;
  });
}
/* Look for a QR code in the photo: whole image, then the lower part (where receipts print it), at several sizes */
let QR_LIB=null;
function loadQrLib(){ if(window.jsQR) return Promise.resolve(); if(QR_LIB) return QR_LIB;
  QR_LIB=new Promise(res=>{ const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; sc.async=true; sc.onload=res; sc.onerror=res; document.head.appendChild(sc); setTimeout(res,4000); });
  return QR_LIB; }
function scanQr(img){
  if(!window.jsQR) return null;
  const W=img.naturalWidth, H=img.naturalHeight;
  const tries=[[0,0,W,H,1200],[0,H*.45,W,H*.55,1400],[0,0,W,H,800],[W*.15,H*.4,W*.7,H*.6,1100]];   // 4 quick passes: most QR are found in the 1st–2nd
  for(const [x,y,w,h,max] of tries){
    const k=Math.min(1,max/Math.max(w,h)), cw=Math.max(1,Math.round(w*k)), ch=Math.max(1,Math.round(h*k));
    const c=document.createElement("canvas"); c.width=cw; c.height=ch; const ctx=c.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(img,x,y,w,h,0,0,cw,ch);
    const r=window.jsQR(ctx.getImageData(0,0,cw,ch).data,cw,ch,{inversionAttempts:"attemptBoth"});
    if(r && r.data) return r.data;
  }
  return null;
}
/* Known receipt QR formats + a generic "link with amount and date" reader */
function parseQr(text){
  if(!text) return null;
  const out={raw:String(text)};
  const num=v=>{ const n=parseFloat(String(v).replace(/\s/g,"").replace(",",".").replace(/[^\d.]/g,"")); return n>0?Math.round(n*100)/100:null; };
  const okDate=s=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const age=daysAgo(s); return age>=0 && age<800 ? s : null; };
  const normDate=v=>{ v=String(v).trim(); let m;
    if(m=v.match(/^(\d{4})-?(\d{2})-?(\d{2})/)) return okDate(`${m[1]}-${m[2]}-${m[3]}`);
    if(m=v.match(/^(\d{2})[.\/-](\d{2})[.\/-](\d{4})/)) return okDate(`${m[3]}-${m[2]}-${m[1]}`);
    if(m=v.match(/^(\d{2})(\d{2})(\d{4})$/)) return okDate(`${m[3]}-${m[2]}-${m[1]}`);
    return null; };
  let url=null; try{ url=new URL(text); out.url=url.href; }catch(e){}
  const qs = url ? url.search.slice(1) : (/[=&]/.test(text) ? text : "");
  const P=new URLSearchParams(qs);
  const get=(...ks)=>{ for(const k of ks) for(const [pk,v] of P) if(pk.toLowerCase()===k) return v; return null; };
  // Russia (FNS): t=20261013T1530&s=123.45&fn=…&i=…&fp=…
  const t=get("t"), s=get("s");
  if(t && s && /^\d{8}T\d{4}/.test(t)){ out.date=normDate(t.slice(0,8)); out.total=num(s); out.currency="RUB"; out.kind="FNS"; return out; }
  // Ukraine: cabinet.tax.gov.ua/cashregs/check?…&sm=123.45&date=20261013
  if(url && /tax\.gov\.ua$/.test(url.hostname)){ out.total=num(get("sm")); out.date=normDate(get("date")||""); out.currency="UAH"; out.kind="UA"; return out; }
  // Generic: any parameter that looks like an amount / date / currency
  const amt=get("sum","suma","summa","amount","total","totalamount","total_amount");
  if(amt) out.total=num(amt);
  const dt=get("date","data","datetime","receipt_date");
  if(dt) out.date=normDate(dt);
  const cur=get("currency","cur","ccy","valuta");
  if(cur && /^[a-z]{3}$/i.test(cur)) out.currency=cur.toUpperCase();
  if(!out.currency && url){ const h=url.hostname; if(/\.md$/.test(h)) out.currency="MDL"; else if(/\.ge$/.test(h)) out.currency="GEL"; else if(/\.am$/.test(h)) out.currency="AMD"; else if(/\.by$/.test(h)) out.currency="BYN"; }
  return out;
}
/* Telegram's own QR scanner (point the camera at the QR on the receipt) */
function scanWithTelegram(){
  if(!(tg && tg.showScanQrPopup)) return;
  tg.showScanQrPopup({text:T().qrPopup}, data=>{ if(!data) return false; const d=S.draft; d._qr=parseQr(data);
    if(d._qr && d._qr.kind) applyTrustedQr(d);
    else if(d._qr && d._qr.total>0){ if(d.amount && Math.abs(Number(d.amount)-d._qr.total)>=0.01){ d._mm={qr:d._qr.total,ai:Number(d.amount),used:"photo"}; } else if(!d.amount){ d.amount=d._qr.total; (d._src=d._src||{}).total="qr?"; } else (d._src=d._src||{}).total="qr"; }
    haptic("success"); try{ tg.closeScanQrPopup(); }catch(e){} render(); return true; });
}
function pager(){ const qp=queuePos(); return (qp?`<div class="qpos"><span class="tag">${T().qOf(qp.n,qp.total)}</span>${S.step===1?`<button type="button" class="more" id="qSkip">${T().qSkip}</button>`:""}</div>`:"")+`<div class="pagerrow"><div class="pager"><span>${S.step}/4</span><span class="dots">${[1,2,3,4].map(i=>{ const can=i!==S.step && ((S.draft&&S.draft._existing) || i<S.step);
  return can?`<button type="button" class="dot" data-goto="${i}" aria-label="${esc(T().goStep(i))}"><i></i></button>`:`<i class="${i===S.step?"on":""}"></i>`; }).join("")}</span></div></div>`; }
function wizBack(){
  const d=S.draft;
  if(S.editField){ S.editField=null; render(); return; }
  if(d && d._existing && S.step===4 && !S.returnTo4){ wizExit(true); return; }   // a saved receipt opens on the review → back = leave
  if(S.step>1){ S.step--; render(); window.scrollTo(0,0); } else wizExit(true); }
/* leave the receipt: back to the claim form it was opened from (or home) */
function wizExit(force){
  const d=S.draft||{}, t=T();
  const leave=()=>{ const f=d.form_id && d.form_id!=="new" && formById(d.form_id); S.editField=null; S.returnTo4=false;
    if(S.draftFrom==="form" && f){ S.formId=f.id; go("form"); } else go("home"); window.scrollTo(0,0); };
  const dirty=!d._existing && (d.amount || d.vendor || d.photo_id);
  if(force || !dirty || !tg || !tg.showConfirm) return leave();
  try{ tg.showConfirm(t.exitQ, ok=>{ if(ok) leave(); }); }catch(e){ leave(); }
}
function vWizard(m){ const t=T(); setHeader([t.s1,t.s2,t.s3,t.s4][S.step-1], wizBack); [null,step1,step2,step3,step4][S.step](m);

function dockAmount(){ const d=S.draft; if(!d.amount) return "—"; if(code3(d.currency)==="USD") return "$"+fmt(d.amount); return d.rate>0 ? `$${fmt(d.amount/d.rate)} · ${fmt(d.amount)} ${code3(d.currency)}` : `${fmt(d.amount)} ${code3(d.currency)}`; }

    ${d._mm?`<div class="note warn">${d._mm.used==="qr"?t.mmQr(fmt(d._mm.qr),fmt(d._mm.ai)):t.mmPhoto(fmt(d._mm.qr),fmt(d._mm.ai))}</div>`:""}

function searchBox(id,ph){ return `<div><input type="text" id="s_${id}" placeholder="${esc(ph)}" autocomplete="off" aria-label="${esc(ph)}"><div class="opts" id="o_${id}" hidden></div></div>`; }

/* Step 2: questions */
const GL_ORDER=["8110","8115","8130","8120","8135","8125","8140","7305","7240","7235","7275"];

    ${S.showMiss&&miss.length?`<div class="note bad" id="missNote">${esc(t.missed(miss.map(x=>x[1])))}</div>`:""}
    <div class="q ${mc("program")}" data-q="program"><h3>${t.qCountry}</h3><div class="chips">${progChips}<button type="button" class="chip" id="progOther" aria-pressed="${otherProg}">${otherProg?esc(d.program):t.otherCountry}</button></div>
      <div id="progSearch" hidden>${searchBox("prog",t.searchCountry)}</div></div>
    <div class="q ${mc("gl")}" data-q="gl"><h3>${t.qGl}</h3><div class="gls">${glCards}</div>
      ${selIdx>5?"":`<button type="button" class="more" id="moreGl">${showAll?t.lessGl:t.moreGl}</button>`}</div>

    <div class="q ${mc("purpose")}" data-q="purpose"><h3>${t.qPurpose}</h3>
      <div class="field"><label for="fPurpose">${t.purposeEn}</label><textarea id="fPurpose" placeholder="${esc(t.purposePh)}" lang="en">${esc(d.purpose)}</textarea><span class="hint">${t.purposeHint}</span></div>
      <button type="button" class="btn light" id="polish" ${d.purpose?"":"disabled"}>${IC.sparkle.replace("<svg","<svg width=\"18\" height=\"18\"")} ${t.toEnglish}</button>
    </div>
    <details ${d.department!=="EUR - Europe"?"open":""}><summary>${t.advanced}</summary>
      <div class="field" style="margin-top:10px"><select id="fDept" aria-label="Department">${LISTS.departments.map(x=>`<option ${x===d.department?"selected":""}>${esc(x)}</option>`).join("")}</select></div></details>
  </section>`;
  const keepScroll = fn => { const y=window.scrollY; fn(); render(); window.scrollTo(0,y); };
  const set=(k,v)=>keepScroll(()=>{ d[k]=v; applyRules(d); });
  m.querySelectorAll("[data-prog]").forEach(b=>b.onclick=()=>{haptic(); d._progBy="user"; set("program",b.dataset.prog)});

  const mg=$("#moreGl"); if(mg) mg.onclick=()=>keepScroll(()=>{S.showAllGl=!S.showAllGl});
  m.querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{haptic();set("class",b.dataset.cls)});

  m.querySelectorAll("[data-tpl]").forEach(b=>b.onclick=()=>keepScroll(()=>{ const x=S.templates.find(y=>y.id===b.dataset.tpl); if(x.program) d._progBy="user"; ["gl","program","class","expense_type","department"].forEach(k=>{if(x[k])d[k]=x[k]}); if(x.purpose&&!d.purpose)d.purpose=x.purpose; if(x.vendor&&!d.vendor)d.vendor=x.vendor; haptic("success"); applyRules(d); }));
  $("#fPurpose").addEventListener("input",e=>{ d.purpose=e.target.value; $("#polish").disabled=!d.purpose; });
  $("#polish").onclick=async()=>{ const b=$("#polish"); b.disabled=true; b.innerHTML=`<span class="spin"></span>`; try{ const j=await api("polish",{text:d.purpose,context:{vendor:d.vendor,gl:d.gl,expense_type:d.expense_type,items:d.note}}); d.purpose=j.text; }catch(e){toast(e.message)} keepScroll(()=>{}); };
  $("#fDept").onchange=e=>set("department",e.target.value);
  setDock({k:d.vendor||t.photoTitle,v:dockAmount(),cta:{html:t.next,onClick:async()=>{ const miss=missing2(d);

/* everything the form needs from step 2 — nothing can be skipped */
function missing2(d){ const t=T(), m=[];
  if(!d.program) m.push(["program",t.qCountry]); if(!d.gl) m.push(["gl",t.qGl]); if(!d.class) m.push(["class",t.qClass]);
  if(!d.expense_type) m.push(["expense_type",t.qType]); if(!String(d.purpose||"").trim()) m.push(["purpose",t.qPurpose]);
  return m; }
function applyRules(d){
  if(d.program && d.program.startsWith("TRN")){ d.department="FMS - Field Ministry Support"; d.gl=ALL_GL.find(x=>x.startsWith("7275")); d.expense_type="Contract Labor"; }
  if(d.gl && d.gl.startsWith("8125") && !d.expense_type) d.expense_type="Contract Labor";
  if(d.gl && d.gl.startsWith("7305") && !d.class) d.class=LISTS.classes.find(x=>x.startsWith("CBSI"));
}

/* Step 3: rate — big local amount, black USD pill */
async function fetchRate(){
  const d=S.draft; const cc=code3(d.currency);
  if(cc==="USD"){ d.rate=1; d.rate_source="USD"; render(); return; }
  if(d.rate && d._rateFor===cc+d.payment_date) return;
  d._rateLoading=true; d._rateErr=""; render();
  try{ const j=await api("rate",{currency:cc,date:d.payment_date}); d.rate=j.rate.rate; d.rate_source=j.rate.source+(j.rate.date&&j.rate.date!==d.payment_date?" "+j.rate.date:""); d._rateFor=cc+d.payment_date; }
  catch(e){ d._rateErr=T().rateErr; }
  d._rateLoading=false; if(S.screen==="wizard"&&S.step===3) render();
}
function step3(m){
  const t=T(), d=S.draft, cc=code3(d.currency);
  const oanda=`https://www.oanda.com/currency-converter/en/?from=USD&to=${cc}&amount=1`;
  const usd = d.rate>0 ? d.amount/d.rate : 0;
  m.innerHTML=`<section class="screen">
    ${pager()}
    <div class="card rate-hero">
      <span class="tag grey">${t.rateTitle}</span>
      <div class="amt num">${fmt(d.amount)} <small>${cc}</small></div>
      ${d._rateLoading?`<div class="blackpill"><span class="spin"></span></div>`:`<div class="blackpill num" id="usdOut">$${fmt(usd)}</div>`}
      <div class="eq num">${d._rateLoading?t.rateFetching:`1 USD = ${d.rate?fmt(d.rate,4):"—"} ${cc}`}</div>
      <div class="muted small">${esc(d.payment_date)}${d.rate_source?" · "+esc(d.rate_source):""}</div>
    </div>
    ${d._rateErr?`<div class="note warn">${esc(d._rateErr)}</div>`:""}
    <div class="field"><label for="fRate">${t.rateManual}</label><input id="fRate" type="text" inputmode="decimal" autocomplete="off" value="${esc(d.rate)}" ${cc==="USD"?"disabled":""}></div>
    <button type="button" class="more" id="oanda">${t.rateCheck} ↗</button>
  </section>`;
  $("#fRate").addEventListener("input",e=>{ d.rate=decNum(e.target.value); d.rate_source="manual"; const u="$"+fmt(d.rate>0?d.amount/d.rate:0); const o=$("#usdOut"); if(o)o.textContent=u; $("#dockInner .v").textContent=u; });
  $("#oanda").onclick=()=>openLink(oanda);
  setDock({k:t.inUsd,v:"$"+fmt(usd),cta:{html:t.next,disabled:d._rateLoading,onClick:()=>{ if(!(+d.rate>0)){toast(t.req+" "+t.rateManual);return} S.step=4; render(); window.scrollTo(0,0); }}});
}

/* Step 4: review as the form row */
function warnings(d){
  const t=T(), w=[];
  const age=daysAgo(d.payment_date);
  if(age<0) w.push(["bad",t.w_future,suggestDate(d)?"year":""]);
  else if(age>60) w.push(["bad",t.w_60(age),suggestDate(d)?"year":""]); else if(age>45) w.push(["warn",t.w_60(age)]);
  if(hasCyr(d.purpose)) w.push(["bad",t.w_cyr+" (Business Purpose)","polish"]);
  if(hasCyr(d.vendor)) w.push(["warn",t.w_cyr+" (Vendor)"]);
  if((glCode(d.gl)==="8125"||d.expense_type==="Contract Labor") && !/[A-Z][a-z]+ [A-Z][a-z]+/.test(d.purpose)) w.push(["warn",t.w_names]);
  if((d.program||"").startsWith("TRN") && !(d.department||"").startsWith("FMS")) w.push(["bad",t.w_trn]);
  if(glCode(d.gl)==="7275" && !(d.program||"").startsWith("TRN")) w.push(["bad",t.w_7275]);
  if(glCode(d.gl)==="7305") w.push(["info",t.w_amb]);
  const du=dupOf(d); if(du) w.push(["bad",t.dupText(du)]);
  const ms=missing2(d); if(ms.length) w.push(["bad",t.missed(ms.map(x=>x[1]))]);
  return w;
}
function step4(m){
  const t=T(), d=S.draft, cc=code3(d.currency), usd=d.amount/d.rate;
  const rows=[["B","Payment Date",d.payment_date,"payment_date"],["C","Vendor Name",d.vendor,"vendor"],["E","Amount in Local Currency",fmt(d.amount)+" "+cc,"amount"],
    ["G","Department",d.department,"step2"],["H","GL Code",d.gl,"step2"],["I","Program Code",d.program,"step2"],["J","Class Code",d.class||"—","step2"],["K","Expense Type",d.expense_type||"—","step2"],["L","Business Purpose",d.purpose,"purpose"],
    ["·",t.items,d.note||"—","note"]];
  const ed=S.editField;
  const editor=f=> f==="payment_date"?`<input id="efIn" type="date" value="${esc(d.payment_date)}" max="${today()}">`
    : f==="amount"?`<div class="two"><input id="efIn" type="text" inputmode="decimal" autocomplete="off" value="${esc(d.amount)}"><select id="efCur">${(QUICK_CUR.includes(cc)?QUICK_CUR:[cc].concat(QUICK_CUR)).map(x=>`<option ${x===cc?"selected":""}>${x}</option>`).join("")}</select></div>`
    : f==="purpose"||f==="note"?`<textarea id="efIn" rows="2">${esc(f==="purpose"?d.purpose:d.note||"")}</textarea>`
    : `<input id="efIn" type="text" value="${esc(d[f]||"")}">`;
  const W=warnings(d); const doubt=amountDoubt(d); const blocking=W.some(x=>x[0]==="bad") || (doubt && !d._amountOk);
  m.innerHTML=`<section class="screen">
    ${pager()}
    <div class="bigq">${t.s4q}</div>

/* Add or replace the picture of a receipt that is already filled in (no AI, the fields stay) */
function attachPhoto(d){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*,application/pdf";
  inp.onchange=async()=>{ const file=inp.files&&inp.files[0]; if(!file) return; const t=T();
    d._attaching=true; step4($("#main"));
    try{ const {b64,mime,url}=await compress(file); const j=await api("attachPhoto",{image:b64,mime});
      if(j.duplicate){ d._dup=null; toast(t.dupText(j.duplicate)); haptic("error"); }
      else { d.photo_id=j.photo_id; d.photo_hash=j.photo_hash; d.photo_mime=j.photo_mime||mime; d._img=url||(/image/.test(mime)?"data:"+mime+";base64,"+b64:null); d._imgFail=!d._img; d._imgTried=true; haptic("success"); toast(t.photoAdded); } }
    catch(e){ toast(t.err+": "+e.message); haptic("error"); }
    d._attaching=false; if(S.draft===d && S.step===4) step4($("#main")); };
  inp.click();
}
/* full-screen receipt: tap to zoom in/out, drag to look around */
function openViewer(src){
  const v=document.createElement("div"); v.className="viewer";
  v.innerHTML=`<div class="vbox"><img src="${src}" alt=""></div><button type="button" class="vclose" aria-label="${esc(T().close||"Close")}">${IC.close.replace("<svg","<svg width=\"20\" height=\"20\"")}</button>`;
  document.body.appendChild(v); const img=v.querySelector("img"), box=v.querySelector(".vbox");
  img.onclick=e=>{ e.stopPropagation(); const z=!v.classList.contains("zoom"); v.classList.toggle("zoom",z); if(z){ const r=img.getBoundingClientRect(); box.scrollLeft=(e.clientX-r.left)*1.5; box.scrollTop=(e.clientY-r.top)*1.5; } };
  const close=()=>{ v.remove(); if(tg && tg.BackButton) try{ tg.BackButton.offClick(close); }catch(e){} };

/* The picture always stays with the receipt — even when the AI could not read it. Stored without AI. */
async function keepPhoto(d){
  if(d.photo_id || !d._b64) return;
  try{ const a=await api("attachPhoto",{image:d._b64,mime:d._mime}); if(a.duplicate) d._dup=a.duplicate; else { d.photo_id=a.photo_id; d.photo_hash=a.photo_hash; d.photo_mime=a.photo_mime||d._mime||""; } }catch(e){}
}

/* ---------- DUPLICATES: the same receipt can be claimed only once ---------- */
function vKey(v){ return String(v||"").toLowerCase().replace(/[^a-z0-9\u0400-\u04ff]+/g,""); }
function sameReceipt(a,b){
  if(a.photo_hash && b.photo_hash && String(a.photo_hash)===String(b.photo_hash)) return true;
  if(!a.payment_date || String(a.payment_date)!==String(b.payment_date)) return false;
  if(code3(a.currency)!==code3(b.currency) || !(+a.amount>0) || Math.abs(Number(a.amount)-Number(b.amount))>=0.005) return false;
  const x=vKey(a.vendor), y=vKey(b.vendor); return !x||!y||x===y||x.startsWith(y)||y.startsWith(x);
}
/* finds the earlier copy: open receipts here, plus what the server found (also in already sent forms) */
function dupOf(d){
  const r=(S.receipts||[]).find(r=>r.id!==d.id && sameReceipt(d,r));
  if(r){ const f=formById(r.form_id)||{}; return {id:r.id,form_title:f.title||"",sent:false,payment_date:r.payment_date,vendor:r.vendor,amount:+r.amount,currency:code3(r.currency),by_photo:!!(d.photo_hash&&d.photo_hash===r.photo_hash)}; }
  const x=d._dup; if(x && x.id!==d.id && (x.by_photo || sameReceipt(d,x))) return x;
  return null;
}

/* ---------- BATCH: many photos, filled one by one ---------- */
/* All photos are read in the background (two at a time); the user fills each receipt in the normal steps, one after another. */
function startBatch(files){
  const form=S.pendingForm||{id:"new"};
  S.queue={ form, items:[...files].slice(0,40).map((f,i)=>({ k:i, file:f, state:"queued",
    d:Object.assign(blankDraft(),{ _img:objUrl(f), _reading:true, form_id:form.id, new_form_title:form.title||"" }) })) };
  S.pendingForm=null;
  readQueue();
  openQueueItem(S.queue.items[0]);
}
function objUrl(f){ if(isPdf(f)) return null; try{ return URL.createObjectURL(f); }catch(e){ return null; } }
async function readQueue(){
  const Q=S.queue;
  const worker=async()=>{ while(S.queue===Q){ const it=Q.items.find(x=>x.state==="queued"); if(!it) return; it.state="reading";
    try{ await readInto(it.d,it.file); }catch(e){ it.d._err=e.message; }
    it.state="read"; it.d._reading=false;
    const typing=it.d._manual && /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
    if(S.draft===it.d && S.screen==="wizard" && S.step===1){ if(typing) toast(T().aiLate); else render(); } else if(S.screen==="home") render(); } };
  await Promise.all([worker(),worker()]);
}
function queueLeft(){ return S.queue ? S.queue.items.filter(it=>!it.done) : []; }
function queuePos(){ const Q=S.queue; if(!Q) return null; const i=Q.items.findIndex(it=>it.d===S.draft); return i<0?null:{n:i+1,total:Q.items.length}; }
function openQueueItem(it){
  S.showMiss=false; S.draft=it.d; S.draft._existing=false; S.step=1; S.screen="wizard"; S.showAllGl=false;
  render(); window.scrollTo(0,0);
}
/* after a receipt of the batch is saved or skipped → next one, or back home when the batch is done */
function queueNext(savedFormId){
  const Q=S.queue; if(!Q) return false;
  const cur=Q.items.find(it=>it.d===S.draft); if(cur) cur.done=true;
  if(savedFormId){ Q.form={id:savedFormId}; Q.items.forEach(it=>{ if(!it.done){ it.d.form_id=savedFormId; it.d.new_form_title=""; } }); }
  const next=Q.items.find(it=>!it.done);
  if(next){ openQueueItem(next); return true; }
  S.queue=null; return false;
}

async function closeForm(f){
  if(S.closingNow) return; S.closingNow=true;
  const t=T(), opts=S.exportOpts||{};
  unlockSound();
  const ov=sentOverlay(f);
  setDock({k:t.making,v:"",cta:{html:`<span class="spin"></span>`,disabled:true,onClick:()=>{}}});
  /* The server checks everything in the first seconds (errors come back right away), then builds the sheet and uploads the files.
     That part goes on by itself on the server, so after a few seconds the app says "it will arrive in Telegram" and the person can close it. */
  const applyClosed=j=>{ if(j&&j.form){ normIds(j.form); const i=S.forms.findIndex(x=>x.id===f.id); if(i>-1) S.forms[i]=j.form; } else { const x=formById(f.id); if(x) x.status="sent"; }
    S.receipts=S.receipts.filter(r=>r.form_id!==f.id); saveSnap(); S.formRows=null; };
  try{
    if(!canBotWrite()) await askWriteAccess();
    const call=()=>api("closeForm",{id:f.id,meta:{reportDate:opts.reportDate||today(),rateMode:opts.rateMode||"reportDate"}});
    const p=withWriteAccess(call);
    const first=await Promise.race([p.then(j=>({j})), wait(5000).then(()=>null)]);
    if(first){ applyClosed(first.j); ov.done(first.j.form||f); }
    else {                                                     // still working → let the server finish in the background
      const snapF=Object.assign({},f); applyClosed(null); ov.done(snapF,true);
      p.then(j=>{ applyClosed(j); if(["home","forms","form"].includes(S.screen)) render(); })
       .catch(e=>{ toast(t.err+": "+e.message); haptic("error"); refresh().then(()=>{ if(["home","forms","form"].includes(S.screen)) render(); }).catch(()=>{}); });
    }
  }catch(e){ ov.close(); toast(t.err+": "+e.message); haptic("error"); }
  S.closingNow=false; render(); window.scrollTo(0,0);
}

function chime(){ try{ if(!AC) return; const now=AC.currentTime;
  [[783.99,0],[1174.66,0.13]].forEach(([f,at])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,now+at); g.gain.exponentialRampToValueAtTime(0.22,now+at+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+at+0.55);
    o.connect(g).connect(AC.destination); o.start(now+at); o.stop(now+at+0.6); }); }catch(e){} }

/* After a save: put the receipt into local state right away (no waiting for the server to re-read everything) */
function applySaved(j){
  const rec=normIds(Object.assign({},j.receipt));
  if(!rec.id){ refresh().then(render).catch(()=>{}); return; }   // never keep an empty receipt in the list
  if(j.created_form) normIds(j.created_form);

/* ---------- the person's own encryption key ----------
   32 random bytes made on the phone and kept in Telegram's CloudStorage for this bot (synced across the person's devices,
   unreachable for the bot owner). Every request carries it; the server locks all data with it and never stores it. */
function cloudGet(k){ return new Promise((res,rej)=>{ try{ tg.CloudStorage.getItem(k,(err,v)=>err?rej(new Error(String(err))):res(v||"")); }catch(e){ rej(e); } }); }
function cloudSet(k,v){ return new Promise((res,rej)=>{ try{ tg.CloudStorage.setItem(k,v,(err,ok)=>err||!ok?rej(new Error(String(err||"not saved"))):res()); }catch(e){ rej(e); } }); }
const keyOk = v => /^[A-Za-z0-9+/]{43}=$/.test(v||"");
async function loadKey(){
  if(DEMO) return "";
  const cloud = !!(tg && tg.CloudStorage && (!tg.isVersionAtLeast || tg.isVersionAtLeast("6.9")));
  const local = load("ek","");
  if(cloud){
    const v = await cloudGet("ek");                       // a read error stops here: a new key must never replace one that exists
    if(keyOk(v)){ store("ek",v); return v; }
    const k = keyOk(local) ? local : btoa(String.fromCharCode.apply(null, crypto.getRandomValues(new Uint8Array(32))));
    await cloudSet("ek",k);
    if(await cloudGet("ek")!==k) throw new Error("KEY_STORE");
    store("ek",k); return k;
  }
  if(keyOk(local)) return local;                          // very old Telegram: the key stays on this phone only
  const k=btoa(String.fromCharCode.apply(null, crypto.getRandomValues(new Uint8Array(32)))); store("ek",k); return k;
}
async function boot(){
  try{ S.ek = await loadKey(); }catch(e){ S.error="KEY_STORE"; S.screen="error"; render(); return; }
  const snap=load("snap",null);
  if(snap && snap.user && snap.user.status==="active" && !DEMO){ S.user=snap.user; applySnap(snap); S.screen="home"; render(); }   // instant first paint
  try{
    const j=await api("boot");
    S.user=j.user; if(j.user.lang && TX[j.user.lang] && !load("lang",null)) S.lang=j.user.lang;
    if(j.user.status!=="active"){ S.screen="pending"; render(); return; }
    applySnap(j); saveSnap();
    if(j.isNew){ toast(T().welcome); }
    if(!canBotWrite() && !load("waAsked",false)){ store("waAsked",true); setTimeout(()=>askWriteAccess(),900); }
    const zipId=new URLSearchParams(location.search).get("zip");
    if(zipId){ sendZipNow(zipId,true); }
    if(!snap || S.screen==="home" || S.screen==="pending") { S.screen = S.screen==="pending"?"home":S.screen; render(); }
    else if(["home","forms"].includes(S.screen)) render();
  }catch(e){
    if(/PENDING/.test(e.message)){ S.screen="pending"; render(); return; }
    if(/KEY_MISMATCH|NO_KEY|BAD_KEY/.test(e.message)){ store("snap",null); S.receipts=[]; S.forms=[]; S.error=e.message; S.screen="error"; render(); return; }
    if(S.user && snap) { toast(T().err+": "+e.message); return; }   // keep working from memory
    S.error=e.message; S.screen="error"; render();
  }
}
function setLang(l){ S.lang=l; store("lang",l); render(); if(S.user && S.user.status==="active" && S.user.lang!==l){ S.user.lang=l; saveSnap(); api("updateProfile",{profile:{lang:l}}).catch(()=>{}); } }
function setMono(on){ document.documentElement.classList.toggle("mono",on); $("#monoBtn").setAttribute("aria-pressed",on); store("mono",on); tgColors(); }
/* Telegram's own top bar (Back · title · ⋯) and bottom area follow the app theme */
function tgColors(){ if(!tg) return; const c=document.documentElement.classList.contains("mono")?"#0D0E10":"#F1F2F4";
  try{ tg.setHeaderColor(c); }catch(e){} try{ tg.setBackgroundColor(c); }catch(e){} try{ tg.setBottomBarColor && tg.setBottomBarColor(c); }catch(e){} }
setMono(!!load("mono",false)); $("#monoBtn").onclick=()=>setMono(!document.documentElement.classList.contains("mono"));
$("#langRu").onclick=()=>setLang("ru"); $("#langUk").onclick=()=>setLang("uk"); $("#langEn").onclick=()=>setLang("en");
if(tg){
  tg.ready(); tg.expand();
  try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
  /* Full screen (home-screen shortcut): Telegram draws its Close and ⌄ ••• buttons over the top of the page → move our header below them */
  const insets=()=>{ try{ const sa=tg.safeAreaInset||{}, ca=tg.contentSafeAreaInset||{};
      const top = tg.isFullscreen ? (sa.top||0)+(ca.top||0) : 0;
      document.documentElement.style.setProperty("--tg-top", top+"px");
      /* Android: env(safe-area-inset-bottom) is 0 in Telegram's WebView, but Telegram reports the system nav bar (◁ ○ □ buttons) here */
      let bot = (sa.bottom||0)+(ca.bottom||0);
      /* older Telegram on Android reports 0 even when the app is drawn under the nav bar: page fills the whole screen → keep 48px clear */
      const guessed = !bot && DEVICE.os==="android" && innerHeight >= screen.height-30;
      if(guessed) bot=48;
      /* which navigation the phone uses: 3 buttons (◁ ○ □, ~48px) or gestures (a thin bar, ~16-24px) */
      DEVICE.nav = DEVICE.os!=="android" ? (bot ? "home-bar" : "none") : guessed ? "buttons?" : bot>=36 ? "buttons" : bot>0 ? "gestures" : "none";
      DEVICE.navH = bot;
      const de=document.documentElement; de.dataset.nav=DEVICE.nav.replace("?","");
      de.style.setProperty("--tg-bottom", bot+"px"); }catch(e){} };
  insets(); ["fullscreenChanged","safeAreaChanged","contentSafeAreaChanged","viewportChanged"].forEach(ev=>{ try{ tg.onEvent(ev,insets); }catch(e){} });
  tgColors();
  tg.BackButton.onClick(()=>{ if(BACK) BACK(); });
}
S.lang = load("lang", (()=>{ const lc=(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code)||""; return lc==="en"?"en":lc==="uk"?"uk":"ru"; })());
if(!TX[S.lang]) S.lang="ru";
S.screen = "pending"; render(); $("#main").innerHTML=`<div class="empty"><span class="spin"></span></div>`; setDock(null);
boot();
</script>
